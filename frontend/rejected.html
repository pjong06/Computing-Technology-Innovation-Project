<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rejected history - Niah Biotrack</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

<nav id="menu"></nav>

<main>
<section class="page on">
  <h1>Rejected <span>history</span></h1>
  <p class="lead">Field records the officer sent back, with the reason given, so officers can look up past decisions.</p>
  <p class="muted" id="rejected-count"></p>
  <div class="bar">
    <a class="btn ghost" href="queue.html" style="text-decoration:none">Back to field records</a>
  </div>
  <div class="split" id="rejected-area">
    <div id="rejected-list"></div>
    <div id="rejected-detail"></div>
  </div>
  <div class="card" id="rejected-empty" hidden>No rejected field records. If an officer rejects a field record by mistake, it will appear here so it can be evaluated again.</div>
</section>
</main>
</div>

<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="js/shared.js"></script>
<script src="js/rejected.js"></script>
</body>
</html>
