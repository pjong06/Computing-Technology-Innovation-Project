<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rejected observations - Niah Biotrack</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">

<style>
.review-section {
  margin-top: 30px;
}

.review-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 18px;
}

.review-header h2 {
  margin: 0 0 6px;
}

.review-header p {
  margin: 0;
  color: #75857b;
}

.review-count {
  background: #f5e7e7;
  color: #9b3d3d;
  border-radius: 20px;
  padding: 8px 14px;
  white-space: nowrap;
}

.review-layout {
  display: grid;
  grid-template-columns: minmax(250px, 340px) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}

.review-sidebar,
.review-detail {
  background: white;
  border: 1px solid #e4eae5;
  border-radius: 16px;
  padding: 18px;
  min-width: 0;
}

.review-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 600px;
  overflow-y: auto;
  padding-right: 6px;
}

.review-list .btn {
  width: 100%;
  text-align: left;
  border-radius: 10px;
  padding: 13px 15px;
  white-space: normal;
  overflow-wrap: anywhere;
  background: #f5f8f5;
  color: #294b39;
  border: 1px solid #e2e9e2;
}

.review-list .btn:hover {
  background: #e4efe6;
  border-color: #81a38b;
}

.review-detail > .card {
  border: 0;
  box-shadow: none;
  padding: 0;
}

.review-detail img {
  max-width: 100%;
  height: auto;
  border-radius: 12px;
}

@media (max-width: 850px) {
  .review-layout,

  .review-list {
    max-height: 280px;
  }
}
</style>
</head>

<body>
<div class="app">

<nav id="menu"></nav>

<main>
<section class="page on">
  <h1>Rejected <span>observations</span></h1>

<div class="bar">
  <a class="btn ghost" href="queue.html" style="text-decoration:none">
    Back to approval queue
  </a>
</div>
  <hr>

<section class="review-section">
  <div class="review-header">
    <div>
      <h2>Rejected Plant Records</h2>
      <p>Plant registrations rejected by conservation officers.</p>
    </div>
    <span id="rejected-plant-count" class="review-count"></span>
  </div>

  <div class="review-layout">
    <div class="review-sidebar">
      <div id="rejected-plant-list" class="review-list"></div>
    </div>

    <div id="rejected-plant-detail" class="review-detail"></div>
  </div>
</section>
</section>
</main>
</div>

<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/shared.js"></script>
<script src="js/rejected.js"></script>
</body>
</html>
