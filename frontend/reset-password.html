<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset Password - Niah Biotrack</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <img class="logo" src="images/logo.png" alt="Niah Biotrack logo">
    <h1>Set a new <span>password</span></h1>
    <p class="lead">Enter your new password below. Use at least 8 characters.</p>

    <div class="form one">
      <label>New password
        <input id="new-password" type="password" autocomplete="new-password">
      </label>
      <label>Confirm new password
        <input id="confirm-password" type="password" autocomplete="new-password">
      </label>
    </div>
    <p id="reset-message" role="alert" hidden></p>
    <button class="btn" id="save-button" onclick="saveNewPassword()">Save new password</button>
    <p class="muted"><a href="login.html">Back to login</a></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="js/shared.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
