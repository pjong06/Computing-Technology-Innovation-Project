<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plants - Niah Biotrack</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
/* Column widths of the plant table (the shared .data-table keeps text inside its cell). */
#plants-table { min-width: 940px; }
#plants-table .col-plant { width: 24%; }
#plants-table .col-tag { width: 14%; }
#plants-table .col-location { width: 16%; }
#plants-table .col-by { width: 12%; }
#plants-table .col-last { width: 11%; }
#plants-table .col-status { width: 13%; }
#plants-table .col-view { width: 72px; }
</style>
</head>
<body>
<div class="app">
<nav id="menu"></nav>
<main class="wide">
<section class="page on">
  <h1>Plants</h1>
  <p class="lead">Every tagged plant, its location and review status, for the conservation officer.</p>

  <article class="card table-card">
    <div class="table-card-head">
      <h2>Plant list</h2>
    </div>
    <div class="table-toolbar">
      <input id="plant-search" type="search" placeholder="Search tag, species or location"
        aria-label="Search by tag code, species name or location">
      <div class="popover-wrap">
        <button class="btn ghost" id="filters-button" type="button" aria-controls="filters-panel">Filters</button>
        <div class="popover" id="filters-panel" role="dialog" aria-label="Plant filters" hidden>
          <label>Species <select id="plant-species"><option value="">All species</option></select></label>
          <label>Conservation status
            <select id="conservation-filter">
              <option value="">All conservation statuses</option>
              <option value="CR">Critically Endangered</option>
              <option value="EN">Endangered</option>
              <option value="VU">Vulnerable</option>
              <option value="NT">Near Threatened</option>
              <option value="LC">Least Concern</option>
              <option value="DD">Data Deficient</option>
              <option value="NA">Not assessed</option>
            </select>
          </label>
          <label>Registered by <select id="registered-by-filter"><option value="">All botanists</option></select></label>
          <button class="btn ghost" id="filters-clear" type="button">Clear filters</button>
        </div>
      </div>
      <div class="popover-wrap">
        <button class="btn ghost" id="export-button" type="button" aria-controls="export-panel">Export</button>
        <div class="popover" id="export-panel" role="dialog" aria-label="Export plant records" hidden>
          <button class="btn ghost" id="export-csv" type="button">CSV (spreadsheet)</button>
          <button class="btn ghost" id="export-pdf" type="button">PDF (Plant records)</button>
          <p class="muted">Exports the plants shown with the current tab, search and filters.</p>
        </div>
      </div>
      <div class="table-tabs" id="plant-tabs" aria-label="Plant review status"></div>
    </div>
    <div class="bulk-bar" id="plants-bulk" aria-label="Actions for the selected plants" hidden></div>
    <p class="table-note" id="plants-count" role="status">Loading plants...</p>
    <div class="card plant-state" id="plants-error" role="alert" hidden></div>
    <div class="table-scroll">
      <table class="data-table" id="plants-table"><thead></thead><tbody></tbody></table>
    </div>
    <div class="table-pager" id="plants-pager"></div>
  </article>
</section>
</main>
</div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="js/shared.js"></script>
<script src="js/plants.js"></script>
</body>
</html>
