<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Distribution map - Niah Biotrack</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

<nav id="menu"></nav>

<main>
<section class="page on">
  <h1>Distribution <span>map</span></h1>
  <p class="lead">Every plant with a GPS location is shown on the map. Click a marker for details.</p>
  <div class="bar">
    <select id="map-species" class="grow" aria-label="Filter by species" onchange="drawMarkers(true)">
      <option value="">All species</option>
    </select>
    <select id="map-status" aria-label="Filter by conservation status" onchange="drawMarkers(true)">
      <option value="">All conservation statuses</option>
      <option value="CR">Critically Endangered</option>
      <option value="EN">Endangered</option>
      <option value="VU">Vulnerable</option>
      <option value="NT">Near Threatened</option>
      <option value="LC">Least Concern</option>
      <option value="DD">Data Deficient</option>
    </select>
    <button class="btn ghost" onclick="resetMapFilters()">Show all on map</button>
    <label class="map-toggle">
      <input type="checkbox" id="map-show-routes" checked onchange="toggleRoutes(this.checked)">
      Show routes
    </label>
  </div>
  <div class="card">
    <div id="map-box"></div>
    <p class="muted" id="map-message"></p>
    <p class="muted" id="map-route-note">Routes from the last 90 days.</p>
  </div>
</section>
</main>
</div>

<div id="toast" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="js/shared.js"></script>
<script src="js/map.js"></script>
</body>
</html>
