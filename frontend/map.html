<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Distribution map - Niah Biotrack</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

<nav id="menu"></nav>

<main>
<section class="page on">
  <h1>Distribution <span>map</span></h1>
  <p class="lead">Every species record with a GPS location is shown on the map. Click a marker for details.</p>
  <div class="bar">
    <input id="map-search" class="grow" placeholder="Search by scientific or common name" oninput="drawMarkers(true)">
    <select id="map-status" onchange="drawMarkers(true)">
      <option value="">All conservation status</option>
      <option>Endangered</option>
      <option>Vulnerable</option>
      <option>Least Concern</option>
    </select>
    <button class="btn ghost" onclick="drawMarkers(true)">Show all on map</button>
  </div>
  <div class="card">
    <div id="map-box"></div>
    <p class="muted" id="map-message"></p>
    <div class="leg">
      <span style="--c:#c0392b">Endangered</span>
      <span style="--c:#e0a800">Vulnerable</span>
      <span style="--c:#3d8b4f">Least Concern</span>
    </div>
  </div>
</section>
</main>
</div>

<div id="toast" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/shared.js"></script>
<script src="js/map.js"></script>
</body>
</html>
