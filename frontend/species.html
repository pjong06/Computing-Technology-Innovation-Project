<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Species catalogue - Niah Biotrack</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
/* Column widths of the species table (the shared .data-table keeps text inside its cell). */
#species-table .col-species { width: 40%; }
#species-table .col-family { width: 22%; }
#species-table .col-status { width: 24%; }
#species-table .col-plants { width: 10%; }
#species-table .col-open { width: 72px; }
</style>
</head>
<body>
<div class="app">

<nav id="menu"></nav>

<main class="wide">
<section class="page on">
  <div class="page-head">
    <h1>Species catalogue</h1>
    <button class="btn" id="add-species" type="button" onclick="openSpeciesEditor('')">+ Add species</button>
  </div>
  <p class="lead">Every plant species recorded in Niah National Park, for the conservation officer.</p>

  <article class="card table-card">
    <div class="table-card-head">
      <h2>Species list</h2>
    </div>
    <div class="table-toolbar">
      <input id="search-box" type="search" placeholder="Search scientific, common or family name"
        aria-label="Search species by scientific, common or family name">
      <div class="popover-wrap">
        <button class="btn ghost" id="filters-button" type="button" aria-controls="filters-panel">Filters</button>
        <div class="popover" id="filters-panel" role="dialog" aria-label="Species filters" hidden>
          <label>Family <select id="family-filter"><option value="">All families</option></select></label>
          <label>Identified to <select id="rank-filter"><option value="">Any rank</option></select></label>
          <label id="plants-filter-label">Plants
            <select id="plants-filter">
              <option value="">Any</option>
              <option value="with">Has plants</option>
              <option value="none">No plants yet</option>
            </select>
          </label>
          <button class="btn ghost" id="filters-clear" type="button">Clear filters</button>
        </div>
      </div>
      <div class="popover-wrap" id="export-wrap">
        <button class="btn ghost" id="export-button" type="button" aria-controls="export-panel">Export</button>
        <div class="popover" id="export-panel" role="dialog" aria-label="Export species inventory" hidden>
          <button class="btn ghost" id="export-csv" type="button">CSV (spreadsheet)</button>
          <button class="btn ghost" id="export-pdf" type="button">PDF (Species inventory)</button>
          <p class="muted" id="export-note">Exports the species shown with the current tab, search and filters.</p>
        </div>
      </div>
      <div class="table-tabs" id="species-tabs" aria-label="Species groups"></div>
    </div>
    <div class="bulk-bar" id="species-bulk" aria-label="Actions for the selected species" hidden></div>
    <p class="table-note" id="species-count">Loading species...</p>
    <div class="table-scroll">
      <table class="data-table" id="species-table"><thead></thead><tbody></tbody></table>
    </div>
    <div class="table-pager" id="species-pager"></div>
  </article>
</section>

</main>
</div>

<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="js/shared.js"></script>
<script src="js/species.js"></script>
</body>
</html>
