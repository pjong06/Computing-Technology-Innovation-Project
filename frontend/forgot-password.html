
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot password - Niah Biotrack</title>

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="auth-wrap">
  <div class="card auth-card">

    <img class="logo" src="images/logo.png" alt="Niah Biotrack logo">

    <h1>Forgot <span>password?</span></h1>

    <p class="lead">
      Enter your registered email. We will send you a 6-digit verification code.
    </p>

    <div class="form one">

      <label>Registered email
        <input
          id="reset-email"
          type="email"
          autocomplete="email"
          placeholder="Enter your email address">
      </label>

      <label id="code-label" hidden>
        6-digit verification code
        <input
          id="reset-code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="Enter the 6-digit code">
      </label>

    </div>

    <p id="reset-message" role="status" hidden></p>

    <button class="btn" id="reset-button" onclick="sendResetEmail()">
      Send verification code
    </button>

    <button class="btn" id="verify-button" onclick="verifyResetCode()" hidden>
      Verify code
    </button>

    <p class="muted">
      <a href="login.html">Back to login</a>
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="js/shared.js"></script>
<script src="js/forgot-password.js"></script>

</body>
</html>
