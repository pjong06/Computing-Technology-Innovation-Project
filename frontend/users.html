<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>User & role admin - Niah Ground-Truth</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

<!-- LEFT MENU (filled in by drawMenu in js/shared.js) -->
<nav id="menu"></nav>

<main>
<section class="page on">
  <h1>User <span>& role admin</span></h1>
  <p class="lead">Botanists cannot self-register. Add accounts here and assign a role.</p>
  <div class="bar">
    <input id="new-name" class="grow" placeholder="Full name">
    <input id="new-email" class="grow" placeholder="Email">
    <button class="btn" onclick="addUser()">Add user</button>
  </div>
  <div class="card tw">
    <table>
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
      <tbody id="user-body"></tbody>
    </table>
  </div>
</section>
</main>
</div>

<div id="toast" role="status"></div>

<script src="js/shared.js"></script>
<script src="js/users.js"></script>
</body>
</html>
