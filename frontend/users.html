<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Users - Niah Biotrack</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
/* Column widths of the users table (the shared .data-table keeps text inside its cell). */
#users-table { min-width: 900px; }
#users-table .col-name { width: 20%; }
#users-table .col-username { width: 14%; }
#users-table .col-email { width: 24%; }
#users-table .col-role { width: 17%; }
#users-table .col-status { width: 12%; }
#users-table .col-actions { width: 13%; }
#users-table select { max-width: 100%; }
.user-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.user-actions .btn { padding: 5px 12px; font-size: 13px; }
.protected { color: var(--mute); font-size: 13px; font-style: italic; }
.add-user { margin-bottom: 16px; }
</style>
</head>
<body>
<div class="app">

<nav id="menu"></nav>

<main class="wide">
<section class="page on">
  <h1>Users</h1>
  <p class="lead">Staff accounts for the app and the portal, managed by the conservation officer.</p>

  <div class="bar add-user" aria-label="Add a botanist">
    <input id="new-username" class="grow" placeholder="Username" aria-label="Username">
    <input id="new-email" class="grow" type="email" placeholder="Email" aria-label="Email">
    <input id="new-password" class="grow" type="password" placeholder="Temporary password" aria-label="Temporary password">
    <button class="btn" type="button" onclick="addUser()">Add botanist</button>
  </div>

  <article class="card table-card">
    <div class="table-card-head">
      <h2>Accounts</h2>
    </div>
    <div class="table-toolbar">
      <input id="user-search" type="search" placeholder="Search by name or email" aria-label="Search accounts by name or email">
      <select id="role-filter" aria-label="Filter by role">
        <option value="">All roles</option>
        <option>Botanist</option>
        <option>Conservation Officer</option>
      </select>
      <select id="status-filter" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="pending">Pending approval</option>
        <option value="suspended">Suspended</option>
      </select>
    </div>
    <p class="table-note" id="users-count" role="status"></p>
    <div class="table-scroll">
      <table class="data-table" id="users-table"><thead></thead><tbody></tbody></table>
    </div>
    <div class="table-pager" id="users-pager"></div>
  </article>
</section>
</main>
</div>

<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="js/shared.js"></script>
<script src="js/users.js"></script>
</body>
</html>
