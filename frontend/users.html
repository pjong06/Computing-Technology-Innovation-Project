<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>User & role admin - Niah Biotrack</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

<nav id="menu"></nav>

<main>
<section class="page on">
  <h1>User <span>& role admin</span></h1>
  <p class="lead">Staff accounts for the portal and the mobile app, managed by the conservation officer. Add a botanist here with a temporary password. Accounts made any other way stay <b>Pending approval</b> until you activate them. There is only one officer account.</p>
  <div class="bar">
    <input id="new-username" class="grow" placeholder="Username" aria-label="Username">
    <input id="new-email" class="grow" type="email" placeholder="Email" aria-label="Email">
    <input id="new-password" class="grow" type="password" placeholder="Temporary password" aria-label="Temporary password">
    <button class="btn" onclick="addUser()">Add user</button>
  </div>
  <p class="muted" id="users-count"></p>
  <div class="card tw">
    <table>
      <thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
      <tbody id="user-body"></tbody>
    </table>
  </div>
</section>
</main>
</div>

<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="js/shared.js"></script>
<script src="js/users.js"></script>
</body>
</html>
