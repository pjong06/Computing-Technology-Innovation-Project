<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Observation approval queue - Niah Biotrack</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

<nav id="menu"></nav>

<main>
<section class="page on">
  <h1>Observation <span>approval queue</span></h1>
  <p class="lead" id="queue-count"></p>
  <div class="bar">
    <button class="btn ghost" onclick="resetQueue()">Reset queue</button>
  </div>
  <div class="split" id="queue-area">
    <div id="queue-list"></div>
    <div id="queue-detail"></div>
  </div>
  <div class="card" id="queue-empty" hidden>All caught up. New observations from the mobile app will appear here after they sync.</div>
</section>
</main>
</div>

<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/shared.js"></script>
<script src="js/queue.js"></script>
</body>
</html>
